# Version and security updates, grouped weekly so they arrive as one PR per ecosystem instead of many (feature-delivery.md).
# Major bumps are ignored on purpose: the app is pinned to React Router 5, Express 4 and similar; migrate by hand.
# Rule: dependency-security.md. Add an ecosystem block per manifest the project has (pip, uv, docker, github-actions).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      client-npm-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
